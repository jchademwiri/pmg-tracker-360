name: E2E — Playwright Browser Tests

on:
  push:
    branches: [dev, master, main]
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  e2e:
    name: Playwright End-to-End Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: pmg_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      SKIP_ENV_VALIDATION: true
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/pmg_test_db?sslmode=disable
      BETTER_AUTH_SECRET: "ci-e2e-test-secret-value-32chars"
      BETTER_AUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_URL: "http://localhost:3000"
      RESEND_API_KEY: "re_ci_build_dummy_key"
      R2_ACCOUNT_ID: "ci-r2-account-id"
      R2_ACCESS_KEY_ID: "ci-r2-access-key-id"
      R2_SECRET_ACCESS_KEY: "ci-r2-secret-access-key"
      R2_BUCKET_NAME: "ci-bucket"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Drizzle Migrations on Test Database
        run: bun run db:migrate

      - name: Install Playwright Browsers & Dependencies
        run: cd apps/tracker && bun run playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: |
          cd apps/tracker && bun run test:e2e

      - name: Upload Playwright Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/tracker/playwright-report/
          retention-days: 7
