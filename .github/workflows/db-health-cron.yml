name: Cron — Database Health & Drift Check

on:
  schedule:
    # Run daily at 04:00 UTC (06:00 SAST)
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: db-health-cron
  cancel-in-progress: false

jobs:
  check-staging:
    name: Check Staging DB Health & Drift
    runs-on: ubuntu-latest
    if: ${{ env.STAGING_DB != '' }}
    env:
      STAGING_DB: ${{ secrets.DATABASE_URL_STAGING || secrets.DATABASE_URL_DEV }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Staging Database Migration State
        env:
          DATABASE_URL: ${{ env.STAGING_DB }}
        run: |
          echo "🔍 Checking Staging Database..."
          bun run db:check

  check-production:
    name: Check Production DB Health & Drift
    runs-on: ubuntu-latest
    if: ${{ env.PROD_DB != '' }}
    env:
      PROD_DB: ${{ secrets.DATABASE_URL_PRODUCTION || secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Production Database Migration State
        env:
          DATABASE_URL: ${{ env.PROD_DB }}
        run: |
          echo "🔍 Checking Production Database..."
          bun run db:check
