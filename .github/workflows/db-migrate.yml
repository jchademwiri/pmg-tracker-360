name: CD — Database Migration

on:
  push:
    branches:
      - dev
      - master
      - main
    paths:
      - 'packages/db/migrations/**'
      - 'packages/db/src/schema.ts'
      - '.github/workflows/db-migrate.yml'

  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Environment'
        required: true
        type: choice
        options:
          - dev_or_staging
          - production
      dry_run:
        description: 'Check status only without applying migrations'
        required: false
        type: boolean
        default: false

concurrency:
  group: db-migration-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  migrate:
    name: Deploy Database Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Determine Target Database URL
        id: db_env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.target_env }}" == "production" ]]; then
              echo "TARGET=production" >> $GITHUB_OUTPUT
              echo "DB_URL=${{ secrets.DATABASE_URL_PRODUCTION || secrets.DATABASE_URL }}" >> $GITHUB_OUTPUT
            else
              echo "TARGET=dev_or_staging" >> $GITHUB_OUTPUT
              echo "DB_URL=${{ secrets.DATABASE_URL_STAGING || secrets.DATABASE_URL_DEV || secrets.DATABASE_URL }}" >> $GITHUB_OUTPUT
            fi
          elif [[ "${{ github.ref }}" == "refs/heads/master" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "TARGET=production" >> $GITHUB_OUTPUT
            echo "DB_URL=${{ secrets.DATABASE_URL_PRODUCTION || secrets.DATABASE_URL }}" >> $GITHUB_OUTPUT
          else
            echo "TARGET=staging" >> $GITHUB_OUTPUT
            echo "DB_URL=${{ secrets.DATABASE_URL_STAGING || secrets.DATABASE_URL_DEV || secrets.DATABASE_URL }}" >> $GITHUB_OUTPUT
          fi

      - name: Check Pre-Migration Sync Status
        env:
          DATABASE_URL: ${{ steps.db_env.outputs.DB_URL }}
        run: |
          echo "🔍 Checking status on target environment: ${{ steps.db_env.outputs.TARGET }}"
          bun run db:check

      - name: Apply Migrations
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        env:
          DATABASE_URL: ${{ steps.db_env.outputs.DB_URL }}
        run: |
          echo "🚀 Executing Drizzle migrations on ${{ steps.db_env.outputs.TARGET }}..."
          bun run db:migrate

      - name: Verify Post-Migration Sync Status
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        env:
          DATABASE_URL: ${{ steps.db_env.outputs.DB_URL }}
        run: |
          echo "✅ Verifying database sync state..."
          bun run db:check || (echo "❌ Drift detected after migration! The database is not in sync." && exit 1)
