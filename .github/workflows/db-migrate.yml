name: CD — Database Migration

on:
  push:
    branches:
      - dev
      - master
      - main
    paths:
      - 'packages/db/migrations/**'
      - 'packages/db/src/schema.ts'
      - '.github/workflows/db-migrate.yml'

  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Environment'
        required: true
        type: choice
        options:
          - dev_or_staging
          - production
      dry_run:
        description: 'Check status only without applying migrations'
        required: false
        type: boolean
        default: false

concurrency:
  group: db-migration-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  migrate:
    name: Deploy Database Migrations
    runs-on: ubuntu-latest
    outputs:
      migration_status: ${{ steps.verify.outputs.status }}
      drift_detected: ${{ steps.verify.outputs.drift_detected }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Determine Target Database URL
        id: db_env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.target_env }}" == "production" ]]; then
              echo "TARGET=production" >> $GITHUB_OUTPUT
              echo "DB_URL=${{ secrets.DATABASE_URL_PRODUCTION || secrets.DATABASE_URL }}" >> $GITHUB_OUTPUT
            else
              echo "TARGET=dev_or_staging" >> $GITHUB_OUTPUT
              echo "DB_URL=${{ secrets.DATABASE_URL_STAGING || secrets.DATABASE_URL_DEV || secrets.DATABASE_URL }}" >> $GITHUB_OUTPUT
            fi
          elif [[ "${{ github.ref }}" == "refs/heads/master" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "TARGET=production" >> $GITHUB_OUTPUT
            echo "DB_URL=${{ secrets.DATABASE_URL_PRODUCTION || secrets.DATABASE_URL }}" >> $GITHUB_OUTPUT
          else
            echo "TARGET=staging" >> $GITHUB_OUTPUT
            echo "DB_URL=${{ secrets.DATABASE_URL_STAGING || secrets.DATABASE_URL_DEV || secrets.DATABASE_URL }}" >> $GITHUB_OUTPUT
          fi

      - name: Pre-Migration Validation
        id: pre_check
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        env:
          DATABASE_URL: ${{ steps.db_env.outputs.DB_URL }}
        run: |
          echo "🔍 Pre-migration validation on: ${{ steps.db_env.outputs.TARGET }}"

          # Count expected migrations from journal (always available, no DB query needed)
          EXPECTED=$(cat packages/db/migrations/meta/_journal.json | python3 -c "import sys,json; print(len(json.load(sys.stdin)['entries']))")
          echo "Expected migrations in repo: $EXPECTED"

          # Run drift check to determine current state
          CHECK_OUTPUT=$(bun run db:check 2>&1 || true)
          echo "$CHECK_OUTPUT"

          # Parse applied count from output
          APPLIED=$(echo "$CHECK_OUTPUT" | grep -oP 'Applied migrations in DB: \K[0-9]+')
          if [ -z "$APPLIED" ]; then
            # If pattern not found (e.g., table doesn't exist), assume 0 applied
            APPLIED=0
          fi
          echo "Applied migrations in DB: $APPLIED"

          PENDING=$((EXPECTED - APPLIED))
          echo "Pending migrations: $PENDING"

          echo "expected=$EXPECTED" >> $GITHUB_OUTPUT
          echo "applied=$APPLIED" >> $GITHUB_OUTPUT
          echo "pending=$PENDING" >> $GITHUB_OUTPUT

          if [ "$PENDING" -gt 0 ]; then
            echo "⏳ $PENDING migration(s) will be applied."
          elif [ "$PENDING" -eq 0 ]; then
            echo "✅ Database is already up to date. No migrations to apply."
          else
            echo "⚠️ WARNING: Database has MORE migrations than repo ($APPLIED > $EXPECTED)"
            echo "   This may indicate divergent/untracked migrations."
          fi

      - name: Apply Migrations
        id: migrate
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) && steps.pre_check.outputs.pending != '0' }}
        env:
          DATABASE_URL: ${{ steps.db_env.outputs.DB_URL }}
        run: |
          echo "🚀 Executing Drizzle migrations on ${{ steps.db_env.outputs.TARGET }}..."
          bun run db:migrate

      - name: Verify Post-Migration Sync Status
        id: verify
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) && steps.pre_check.outputs.pending != '0' }}
        env:
          DATABASE_URL: ${{ steps.db_env.outputs.DB_URL }}
        run: |
          echo "✅ Verifying database sync state..."
          set +e
          DRIFT_OUTPUT=$(bun run db:check 2>&1)
          DRIFT_EXIT=$?
          set -e
          echo "$DRIFT_OUTPUT"
          echo "drift_details<<EOF" >> $GITHUB_OUTPUT
          echo "$DRIFT_OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          if [ $DRIFT_EXIT -eq 0 ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "drift_detected=false" >> $GITHUB_OUTPUT
          else
            echo "status=drift_detected" >> $GITHUB_OUTPUT
            echo "drift_detected=true" >> $GITHUB_OUTPUT
            echo ""
            echo "❌ Drift detected after migration! The database is not in sync."
            exit 1
          fi

  alert-on-failure:
    name: Alert on Migration Failure
    needs: [migrate]
    if: always() && needs.migrate.outputs.drift_detected == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Create GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            const driftDetails = `${{ needs.migrate.outputs.drift_details }}`;
            const targetEnv = '${{ needs.migrate.outputs.drift_detected }}' === 'true' ? 'unknown' : 'known';

            const title = `🚨 Migration Drift Detected — ${new Date().toISOString().split('T')[0]}`;
            const body = `## Database Migration Drift Detected

            A database migration was applied but the post-migration drift check detected that the database is not in sync.

            ### Drift Details
            \`\`\`
            ${driftDetails}
            \`\`\`

            ### Workflow Run
            [View the full workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ### How to Fix
            1. Check pending migrations: \`bun run db:check\`
            2. Try applying manually: \`bun run db:migrate\`
            3. If that fails, debug: \`bun run debug:migrate\`
            4. As a last resort, force-apply: \`cd packages/db && bun run push\`

            ---
            *Auto-created by [db-migrate](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['database', 'drift', 'bug'],
            });
            core.info(`Created issue #${issue.data.number}`);
