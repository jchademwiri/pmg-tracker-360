<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Background Container -->
  <rect width="64" height="64" rx="14" fill="#0c131d"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
  
  <!-- Outer Compass Ring -->
  <circle cx="32" cy="32" r="24" stroke="#059669" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="32" cy="32" r="20" stroke="#10b981" stroke-width="2.5" stroke-dasharray="88 38" stroke-linecap="round" transform="rotate(-30 32 32)"/>
  
  <!-- Arrow Head on Ring -->
  <path d="M35 12L39 16L33 19" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Inner Gold Target Ring -->
  <circle cx="32" cy="32" r="13" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.85"/>
  <circle cx="32" cy="32" r="7" stroke="#fbbf24" stroke-width="1.5"/>
  
  <!-- Crosshairs -->
  <line x1="32" y1="15" x2="32" y2="49" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.9"/>
  <line x1="15" y1="32" x2="49" y2="32" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.9"/>
  
  <!-- Center Bullseye Dot -->
